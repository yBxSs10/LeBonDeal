name: CI — LeBonDeal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Installer les dépendances
      - name: Install dependencies
        run: flutter pub get

      # 4. Vérifier le formatage du code
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # 5. Analyse statique (lint)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      # 6. Lancer tous les tests unitaires
      - name: Run unit tests
        run: flutter test --reporter=expanded

      # 7. Générer le rapport de couverture
      - name: Run tests with coverage
        run: flutter test --coverage

      # 8. Uploader le rapport de couverture (optionnel — Codecov)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 30

      # 9. Vérifier que les dépendances de monitoring sont présentes
      - name: Verify monitoring dependencies
        run: |
          grep -q "firebase_crashlytics" pubspec.yaml && echo "✅ Crashlytics présent" || (echo "❌ Crashlytics manquant" && exit 1)
          grep -q "firebase_performance" pubspec.yaml && echo "✅ Performance Monitoring présent" || (echo "❌ Performance Monitoring manquant" && exit 1)

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1. Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Installer les dépendances
      - name: Install dependencies
        run: flutter pub get

      # 4. Compiler l'APK (prototype fonctionnel)
      - name: Build APK
        run: flutter build apk --debug --build-name=1.0.0 --build-number=${{ github.run_number }}

      # 5. Publier l'APK comme artefact téléchargeable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lebondeal-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
